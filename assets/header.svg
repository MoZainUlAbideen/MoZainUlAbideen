<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Muhammad Zain-ul-Abideen, AI Engineer. Reliable AI systems, measured before they ship.">
  <title>Muhammad Zain-ul-Abideen · AI Engineer</title>
  <style>
@font-face{font-family:"ZSerif";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"ZSans";font-weight:900;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"ZSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"ZMono";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
    .m{font-family:"ZMono",ui-monospace,Menlo,monospace;font-weight:500}
    .s{font-family:"ZSans",system-ui,"Segoe UI",Arial,sans-serif}
    .r{font-family:"ZSerif",Georgia,"Times New Roman",serif}
    @keyframes pulse{0%,100%{opacity:.18}50%{opacity:.45}}
    .halo{animation:pulse 2.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.sat,.halo{display:none}}
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(255,255,255,.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.773" cy="0.516" r=".42">
      <stop offset="0" stop-color="#23473a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#23473a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="380" rx="24"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="380" fill="#0c0b0b"/>
    <rect width="1280" height="380" fill="url(#grid)"/>
    <rect width="1280" height="380" fill="url(#glow)"/>

    <!-- orbit -->
    <g transform="rotate(-9 990 196)">
      <ellipse cx="990" cy="196" rx="196" ry="58" fill="none" stroke="rgba(255,255,255,.14)"/>
      <ellipse cx="990" cy="196" rx="129" ry="36" fill="none" stroke="rgba(111,220,159,.3)" stroke-dasharray="2 6"/>
      <ellipse cx="990" cy="196" rx="59" ry="16" fill="#23473a" fill-opacity=".55" stroke="rgba(255,255,255,.08)"/>
      <g class="sat">
        <circle r="9" fill="#6fdc9f" opacity=".35" filter="url(#soft)">
          <animateMotion dur="16s" repeatCount="indefinite" path="M794,196 a196,58 0 1,0 392,0 a196,58 0 1,0 -392,0"/>
        </circle>
        <circle r="4" fill="#6fdc9f">
          <animateMotion dur="16s" repeatCount="indefinite" path="M794,196 a196,58 0 1,0 392,0 a196,58 0 1,0 -392,0"/>
        </circle>
      </g>
    </g>
    <g>
      <g transform="translate(999.3,121.0)"><rect width="83.7" height="22" rx="11" fill="#0c0b0b" stroke="rgba(111,220,159,.35)"/><text x="41.9" y="15" text-anchor="middle" class="m" font-size="11" fill="#9fe0bb" letter-spacing="1.4">RETRIEVAL</text></g>
      <g transform="translate(1152.7,154.3)"><rect width="61.8" height="22" rx="11" fill="#0c0b0b" stroke="rgba(111,220,159,.35)"/><text x="30.9" y="15" text-anchor="middle" class="m" font-size="11" fill="#9fe0bb" letter-spacing="1.4">AGENTS</text></g>
      <g transform="translate(1027.6,230.0)"><rect width="61.8" height="22" rx="11" fill="#0c0b0b" stroke="rgba(111,220,159,.35)"/><text x="30.9" y="15" text-anchor="middle" class="m" font-size="11" fill="#9fe0bb" letter-spacing="1.4">VISION</text></g>
      <g transform="translate(807.8,243.5)"><rect width="61.8" height="22" rx="11" fill="#0c0b0b" stroke="rgba(111,220,159,.35)"/><text x="30.9" y="15" text-anchor="middle" class="m" font-size="11" fill="#9fe0bb" letter-spacing="1.4">SPEECH</text></g>
      <g transform="translate(800.8,176.1)"><rect width="54.5" height="22" rx="11" fill="#0c0b0b" stroke="rgba(111,220,159,.35)"/><text x="27.2" y="15" text-anchor="middle" class="m" font-size="11" fill="#9fe0bb" letter-spacing="1.4">EVALS</text></g>
    </g>

    <!-- vertical edge text, like the ID card -->
    <text transform="translate(1246 44) rotate(90)" class="m" font-size="11" letter-spacing="3.2" fill="rgba(243,239,233,.38)">SHIPPED · TESTED · MEASURED</text>

    <!-- copy -->
    <circle cx="70" cy="70" r="9" fill="#3fbf7f" class="halo"/>
    <circle cx="70" cy="70" r="4.5" fill="#3fbf7f"/>
    <text x="88" y="75" class="m" font-size="13" letter-spacing="2.4" fill="#9fe0bb">AI ENGINEER · BENG ELECTRICAL · NUST ’26</text>
    <line x1="64" y1="102" x2="700" y2="102" stroke="rgba(255,255,255,.18)" stroke-dasharray="4 5"/>

    <text x="64" y="148" class="s" font-weight="600" font-size="15" letter-spacing="5" fill="rgba(243,239,233,.62)">MUHAMMAD</text>
    <text x="61" y="222" class="s" font-weight="900" font-size="70" letter-spacing="-2.4" fill="#ffffff">ZAIN-UL-ABIDEEN</text>

    <text x="64" y="280" class="r" font-size="31" letter-spacing="-.6" fill="#f3efe9">Reliable AI systems, <tspan fill="#6fdc9f">measured before they ship.</tspan></text>

    <line x1="64" y1="312" x2="700" y2="312" stroke="rgba(255,255,255,.18)" stroke-dasharray="4 5"/>
    <text x="64" y="342" class="m" font-size="12.5" letter-spacing="1.2" fill="rgba(243,239,233,.5)">RAG  ·  AGENTS  ·  COMPUTER VISION  ·  SPEECH  ·  EVALS IN CI</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="379" rx="24" fill="none" stroke="rgba(255,255,255,.1)"/>
</svg>
